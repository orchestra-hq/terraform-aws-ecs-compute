name: Notify clients of a release
run-name: 📣 Notify clients of ${{ github.event.release.tag_name }}
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  notify:
    name: Trigger client notification
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Orchestra notification pipeline
        env:
          ORCHESTRA_API_TOKEN: ${{ secrets.ORCHESTRA_API_TOKEN }}
          PIPELINE_ID: ${{ vars.ORCHESTRA_MODULE_RELEASE_PIPELINE_ID }}
          MODULE_VERSION: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl -sS --fail-with-body -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ORCHESTRA_API_TOKEN" \
            -d "$(jq -n --arg repository "$REPOSITORY" --arg module_version "$MODULE_VERSION" \
              '{runInputs: {repository: $repository, module_version: $module_version}}')" \
            "https://app.getorchestra.io/api/engine/public/pipelines/${PIPELINE_ID}/start"
